name: Bug report
description: Report a defect in relay-forge
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first, and make sure the problem reproduces on an unmodified build of this repository.

        Problems of a third-party hosting or relay service are out of scope here. Report security issues privately as described in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag, commit, or release. `latest` does not identify code and is not accepted.
      placeholder: e.g. v0.1.0 or 12b6019
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - install.sh
        - docker compose by hand
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: Actual behaviour, blast radius, frequency, and why you believe the cause is in this project rather than upstream or the client.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal executable steps; include a redacted request and response for API issues.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs and screenshots
      description: Redact API keys, upstream credentials and user data.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: The problem reproduces on an unmodified build of this repository.
          required: true
        - label: Logs and requests are redacted and contain no secrets.
          required: true
        - label: I wrote this summary myself and did not paste a large block of AI output.
          required: true
