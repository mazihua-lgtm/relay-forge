name: 功能建议
description: 建议 relay-forge 增加或改进的能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景。与「站长收益、客户管理、渠道运维」无关的通用网关能力，建议提给上游 [new-api](https://github.com/QuantumNous/new-api)，避免两边重复实现。

        方向性改动请先在本 Issue 里讨论，达成一致后再写代码。

  - type: textarea
    id: need
    attributes:
      label: 需求描述
      description: 你希望它做什么，用一两句话说清。
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它？规模多大、多久用一次？
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 现有做法为什么不够
      description: 目前你是怎么绕过去的，卡在哪。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 可选：实现思路
      description: 有想法可以写，没有也可以留空。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 与 RELAY-FORGE.md，确认这不是已实现或已在讨论的功能。
          required: true
        - label: 这个需求与本项目的定位相关，而不是通用网关能力。
          required: true
        - label: 正文由我本人提炼，没有直接粘贴大段 AI 输出。
          required: true
