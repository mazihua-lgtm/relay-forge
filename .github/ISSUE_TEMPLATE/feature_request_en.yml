name: Feature request
description: Suggest a capability for relay-forge
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the use case. Generic gateway features unrelated to operator earnings, customer management or channel operations belong upstream in [new-api](https://github.com/QuantumNous/new-api).

        Discuss directional changes in this issue before writing code.

  - type: textarea
    id: need
    attributes:
      label: What you need
      description: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: When do you need it, at what scale, and how often?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Why the current options are not enough
      description: How do you work around it today, and where does that break?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Optional: implementation idea"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and RELAY-FORGE.md; this is neither implemented nor already discussed.
          required: true
        - label: This fits the project's scope rather than being a generic gateway feature.
          required: true
        - label: I wrote this summary myself and did not paste a large block of AI output.
          required: true
