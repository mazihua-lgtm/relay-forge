name: 报告问题
description: 报告 relay-forge 的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue，并确认问题能在本仓库未修改的版本上复现。

        第三方托管站、中转站的问题请联系其运营方，这里不受理。安全漏洞请按 SECURITY.md 私下报告。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 镜像标签、commit 或 Release 版本。`latest` 无法定位代码，不作为有效版本信息。
      placeholder: 例如 v0.1.0 或 12b6019
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - install.sh 一键部署
        - 手动 docker compose
        - 源码构建
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际现象、影响范围、发生频率，以及判断问题在本项目而非上游或客户端的依据。
      placeholder: |
        实际现象：
        影响范围：
        发生频率：
        判断依据：
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 给出可执行的最小步骤；涉及 API 的请附脱敏后的请求与响应。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图
      description: 请脱敏，不要包含 API Key、上游凭据或用户数据。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复。
          required: true
        - label: 我已确认问题可在本仓库未修改的版本上复现。
          required: true
        - label: 日志与请求已脱敏，不含任何密钥。
          required: true
        - label: 正文由我本人提炼，没有直接粘贴大段 AI 输出。
          required: true
